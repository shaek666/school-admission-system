services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: admission
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      ConnectionStrings__Default: ${DB_CONNECTION_STRING:-Host=postgres;Port=5432;Database=admission;Username=postgres;Password=postgres;Maximum Pool Size=40;Timeout=60}
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      EXPIRY_SWEEP_SECONDS: ${EXPIRY_SWEEP_SECONDS:-30}
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  backend-tests:
    build:
      context: ./backend
      target: test
    profiles: [test]
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=admission_test;Username=postgres;Password=postgres;Maximum Pool Size=40;Timeout=60
    depends_on:
      postgres:
        condition: service_healthy

  blackbox:
    image: node:22-alpine
    profiles: [test]
    command: ["node", "/scripts/blackbox.mjs"]
    environment:
      BASE_URL: http://backend:8080
    volumes:
      - ./scripts:/scripts:ro
    depends_on: [backend]

volumes:
  pgdata:
